<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <meta name="description" content="Graphic design portfolio" />
    <link rel="icon" href="assets/cursor.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <main>
      <section class="homeTop" aria-label="Home navigation">
        <div class="wrap homeTopInner">
          <div class="homeStage" role="presentation">
            <div class="homeTopRow">
              <a class="homeName" href="index.html#top">Amelie Carrillo</a>

              <nav class="miniNav" aria-label="Top navigation">
                <a class="miniNavLink" href="#workStart">Work</a>
                <a class="miniNavLink" href="play.html">Play</a>
                <a class="miniNavLink" href="about.html">About</a>
              </nav>
            </div>

            <svg class="homeNametag homeSvgText" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575.2 353.53" aria-hidden="true" focusable="false">
              <rect fill="#f04e34" x="60.41" y="64.91" width="463.51" height="239.1" transform="translate(-1.2 1.92) rotate(-.37)"/>
              <text fill="#fff" font-family="ABCArizonaSerifUnlicensedTrial-Regular, 'ABC Arizona Serif Unlicensed Trial'" font-size="28" transform="translate(86.65 144.36) rotate(-.37)">
                <tspan x="0" y="0">Hi! </tspan>
                <tspan x="47.18" y="0" letter-spacing="-.02em">M</tspan>
                <tspan x="72.97" y="0" letter-spacing="-.03em">y</tspan>
                <tspan x="86.83" y="0" xml:space="preserve"> name is</tspan>
              </text>
              <text fill="#fff" font-family="ABCArizonaSerifUnlicensedTrial-Bold, 'ABC Arizona Serif Unlicensed Trial'" font-size="55" font-weight="700" letter-spacing="-.01em" transform="translate(83.79 228.67) rotate(-.37)">
                <tspan x="0" y="0">Amelie Carrillo!</tspan>
              </text>
            </svg>

            <svg class="homeAboutText homeSvgText" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575.2 353.53" aria-hidden="true" focusable="false">
              <polygon class="cls-3" points="473.35 114.02 473.57 234.49 419.29 272.43 153.03 272.89 152.76 114.58 473.35 114.02"/>
              <text class="cls-1" transform="translate(172.7 147.67) rotate(-.1)">
                <tspan class="cls-7" x="0" y="0">I’m a sophomore studying graphic </tspan>
                <tspan x="0" y="20"><tspan class="cls-7">design and geography </tspan><tspan class="cls-5">@ UTK!</tspan></tspan>
                <tspan class="cls-7" x="0" y="60">I’m interested in exploring </tspan>
                <tspan class="cls-7" x="0" y="80">different ways culture can connect </tspan>
                <tspan class="cls-7" x="0" y="100">with design.</tspan>
              </text>
              <polygon class="cls-2" points="473.75 234.32 418.91 234.86 419.28 272.44 473.75 234.32"/>
            </svg>

            <a class="homePin homePin--work" href="#workStart" aria-label="Work">
              <img src="assets/squares/work.svg" alt="" />
            </a>
            <a class="homePin homePin--play" href="play.html" aria-label="Play">
              <img src="assets/squares/play.svg" alt="" />
            </a>
            <a class="homePin homePin--resume" href="about.html" aria-label="Resume">
              <img src="assets/squares/resume.svg" alt="" />
            </a>
          </div>
        </div>
      </section>

      <section class="grid" id="workStart" aria-label="Work grid">
        <div class="wrap">
          <div class="cards" data-works></div>
        </div>
      </section>
    </main>

    <div class="workModalOverlay" hidden data-work-modal-overlay>
      <div class="workModal" role="dialog" aria-modal="true" aria-label="Work details" data-work-modal>
        <div class="workModalTop">
          <div class="workModalTopTitle" data-work-modal-title></div>
          <button class="workModalClose" type="button" aria-label="Close" data-work-modal-close>Close</button>
        </div>

        <div class="workModalBody">
          <div class="workModalLeft">
            <div class="workMetaDate" data-work-modal-date></div>
            <div class="workMetaDesc" data-work-modal-desc>
              Add a description of the work here.
            </div>
            <div class="workModalStack" data-work-modal-stack></div>
          </div>

          <div class="workModalRight" data-work-modal-gallery></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="cursor-star.js"></script>
  </body>
</html>
